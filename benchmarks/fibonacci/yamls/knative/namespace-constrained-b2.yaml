apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-b2
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-b2
  namespace: constrained-tests-b2
spec:
  hard:
    requests.cpu: "1310m"    # Two B2 pods (1260m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "1310m"
    requests.memory: "1406Mi" # Two B2 pods (1356Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "1406Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-b2
  namespace: constrained-tests-b2
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "500Mi"
    max:
      cpu: "500m"      # Hard maximum per container - enforces B2 function limit
      memory: "500Mi"  # Hard maximum per container - enforces B2 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
