apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-b4
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-b4
  namespace: constrained-tests-b4
spec:
  hard:
    requests.cpu: "2090m"    # Eight B4 pods (2040m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "2090m"
    requests.memory: "2386Mi" # Eight B4 pods (2336Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "2386Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-b4
  namespace: constrained-tests-b4
spec:
  limits:
  - default:
      cpu: "125m"
      memory: "125Mi"
    max:
      cpu: "125m"      # Hard maximum per container - enforces B4 function limit
      memory: "125Mi"  # Hard maximum per container - enforces B4 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
