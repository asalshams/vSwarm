apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-c4
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-c4
  namespace: constrained-tests-c4
spec:
  hard:
    requests.cpu: "3090m"    # Eight C4 pods (3040m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "3090m"
    requests.memory: "3586Mi" # Eight C4 pods (3536Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "3586Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-c4
  namespace: constrained-tests-c4
spec:
  limits:
  - default:
      cpu: "250m"
      memory: "250Mi"
    max:
      cpu: "250m"      # Hard maximum per container - enforces C4 function limit
      memory: "250Mi"  # Hard maximum per container - enforces C4 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
