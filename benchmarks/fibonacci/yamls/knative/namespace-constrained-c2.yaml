apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-c2
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-c2
  namespace: constrained-tests-c2
spec:
  hard:
    requests.cpu: "2310m"    # Two C2 pods (2260m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "2310m"
    requests.memory: "2450Mi" # Two C2 pods (2400Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "2450Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-c2
  namespace: constrained-tests-c2
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "1Gi"
    max:
      cpu: "1000m"     # Hard maximum per container - enforces C2 function limit
      memory: "1Gi"    # Hard maximum per container - enforces C2 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
