apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-c3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-c3
  namespace: constrained-tests-c3
spec:
  hard:
    requests.cpu: "2570m"    # Four C3 pods (2520m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "2570m"
    requests.memory: "2754Mi" # Four C3 pods (2704Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "2754Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-c3
  namespace: constrained-tests-c3
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "500Mi"
    max:
      cpu: "500m"      # Hard maximum per container - enforces C3 function limit
      memory: "500Mi"  # Hard maximum per container - enforces C3 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
