apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-c5
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-c5
  namespace: constrained-tests-c5
spec:
  hard:
    requests.cpu: "3350m"    # Ten C5 pods (3300m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "3350m"
    requests.memory: "3690Mi"  # Ten C5 pods (3640Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "3690Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-c5
  namespace: constrained-tests-c5
spec:
  limits:
  - default:
      cpu: "200m"
      memory: "200Mi"
    max:
      cpu: "200m"      # Hard maximum per container - enforces C5 function limit
      memory: "200Mi"  # Hard maximum per container - enforces C5 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
