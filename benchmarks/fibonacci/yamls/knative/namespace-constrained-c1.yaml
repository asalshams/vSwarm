apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-c1
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-c1
  namespace: constrained-tests-c1
spec:
  hard:
    requests.cpu: "2180m"    # Single C1 pod (2130m) + 50m buffer (queue-proxy gets 100m CPU)
    limits.cpu: "2180m"
    requests.memory: "2262Mi" # Single C1 pod (2212Mi) + 50Mi buffer (queue-proxy gets 100Mi memory)
    limits.memory: "2262Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-c1
  namespace: constrained-tests-c1
spec:
  limits:
  - default:
      cpu: "2000m"
      memory: "2Gi"
    max:
      cpu: "2000m"     # Hard maximum per container - enforces C1 function limit
      memory: "2Gi"    # Hard maximum per container - enforces C1 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
