apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-a5
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-a5
  namespace: constrained-tests-a5
spec:
  hard:
    requests.cpu: "280m"    # Single A5 pod (230m) + 50m buffer (queue-proxy gets 100m CPU)
    limits.cpu: "280m"
    requests.memory: "314Mi"  # Single A5 pod (264Mi) + 50Mi buffer (queue-proxy gets 100Mi memory)
    limits.memory: "314Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-a5
  namespace: constrained-tests-a5
spec:
  limits:
  - default:
      cpu: "100m"
      memory: "100Mi"
    max:
      cpu: "100m"     # Hard maximum per container - enforces A5 function limit
      memory: "100Mi"  # Hard maximum per container - enforces A5 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
