apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-a2
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-a2
  namespace: constrained-tests-a2
spec:
  hard:
    requests.cpu: "680m"     # Single A2 pod (630m) + 50m buffer (queue-proxy gets 100m CPU)
    limits.cpu: "680m"
    requests.memory: "728Mi"  # Single A2 pod (678Mi) + 50Mi buffer (queue-proxy gets 100Mi memory)
    limits.memory: "728Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-a2
  namespace: constrained-tests-a2
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "500Mi"
    max:
      cpu: "500m"      # Hard maximum per container - enforces A2 function limit
      memory: "500Mi"  # Hard maximum per container - enforces A2 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
