apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-b3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-b3
  namespace: constrained-tests-b3
spec:
  hard:
    requests.cpu: "1570m"    # Four B3 pods (1520m) + 50m buffer (queue-proxy gets 100m CPU per pod)
    limits.cpu: "1570m"
    requests.memory: "1730Mi" # Four B3 pods (1680Mi) + 50Mi buffer (queue-proxy gets 100Mi memory per pod)
    limits.memory: "1730Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-b3
  namespace: constrained-tests-b3
spec:
  limits:
  - default:
      cpu: "250m"
      memory: "250Mi"
    max:
      cpu: "250m"      # Hard maximum per container - enforces B3 function limit
      memory: "250Mi"  # Hard maximum per container - enforces B3 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
