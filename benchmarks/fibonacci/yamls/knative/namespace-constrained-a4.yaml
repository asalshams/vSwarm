apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-a4
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-a4
  namespace: constrained-tests-a4
spec:
  hard:
    requests.cpu: "305m"     # Single A4 pod (255m) + 50m buffer (queue-proxy gets 100m CPU)
    limits.cpu: "305m"
    requests.memory: "342Mi"  # Single A4 pod (292Mi) + 50Mi buffer (queue-proxy gets 100Mi memory)
    limits.memory: "342Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-a4
  namespace: constrained-tests-a4
spec:
  limits:
  - default:
      cpu: "125m"
      memory: "125Mi"
    max:
      cpu: "125m"      # Hard maximum per container - enforces A4 function limit
      memory: "125Mi"  # Hard maximum per container - enforces A4 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
