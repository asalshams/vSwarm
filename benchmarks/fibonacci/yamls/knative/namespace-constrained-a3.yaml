apiVersion: v1
kind: Namespace
metadata:
  name: constrained-tests-a3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-quota-a3
  namespace: constrained-tests-a3
spec:
  hard:
    requests.cpu: "430m"     # Single A3 pod (380m) + 50m buffer (queue-proxy gets 100m CPU)
    limits.cpu: "430m"
    requests.memory: "470Mi"  # Single A3 pod (420Mi) + 50Mi buffer (queue-proxy gets 100Mi memory)
    limits.memory: "470Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-limit-range-a3
  namespace: constrained-tests-a3
spec:
  limits:
  - default:
      cpu: "250m"
      memory: "250Mi"
    max:
      cpu: "250m"      # Hard maximum per container - enforces A3 function limit
      memory: "250Mi"  # Hard maximum per container - enforces A3 function limit
    min:
      cpu: "10m"
      memory: "10Mi"
    type: Container
